name: Sync Market Data to Oracle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy market_data.db to Oracle
        run: |
          scp -i ~/.ssh/oracle_key \
            -o StrictHostKeyChecking=accept-new \
            market_data.db \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:${{ secrets.ORACLE_DATA_PATH }}/market_data_gh.db

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/oracle_key

      - name: Log sync completion
        run: |
          echo "Market data synced to Oracle (${{ github.event.inputs.environment }})"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
